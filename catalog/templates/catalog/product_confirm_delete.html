{% extends 'base.html' %}

{% block content %}
<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card shadow-sm border-primary">
        <div class="card-header bg-primary text-white text-center">
          <h4 class="mb-0">Подтверждение удаления</h4>
        </div>
        <form method="post" enctype="multipart/form-data" class="p-4">
          {% csrf_token %}
          <div class="alert alert-info d-flex align-items-center" role="alert">
            <strong>Вы уверены, что хотите удалить товар из каталога:</strong> "{{ object.title }}"?
          </div>

          <div class="d-flex justify-content-between mt-4">
            <button type="submit" class="btn btn-primary flex-fill me-2">
              Удалить
            </button>
            <a href="{% url 'catalog:product_list' %}" class="btn btn-secondary flex-fill ms-2">
              Отмена
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
