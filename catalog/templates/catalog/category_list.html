{% extends 'base.html' %}

{% block content %}
<div class="py-5 bg-light">
  <div class="container text-center mb-5">
    <h1 class="display-4">Выберите категорию</h1>
  </div>
  <div class="container">
    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-4">
      {% for category in category_list %}
      <div class="col">
        <div class="card h-100 shadow-sm border-light rounded">
          <div class="card-header bg-white border-bottom-0 text-center py-3">
            <h5 class="card-title mb-0">{{ category.name }}</h5>
          </div>
          <div class="card-body d-flex flex-column justify-content-between">
            <p class="card-text mb-4">Описание: {{ category.description|truncatechars:150 }}</p>
            <div class="d-grid gap-2">
              <a href="{% url 'catalog:product_category' category.id %}" class="btn btn-primary btn-block">Перейти</a>
            </div>
          </div>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</div>
{% endblock %}
