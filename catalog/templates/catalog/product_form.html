{% extends 'base.html' %}
{% block content %}


<body>
 <h1>{% if object %}
     Редактировать товар
     {% else %}
     Добавить новый товар
     {% endif %}</h1>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit" class="btn btn-primary">
                 {% if object %}
                 Сохранить
                 {% else %}
                 Добавить
                {% endif %}
             </button>
         <a href="{% url 'catalog:product_list' %}" class="btn btn-secondary">Отмена</a>
    </form>
</body>

{% endblock %}
